# Server configuration
server.port=8080

# Spring Application Name
spring.application.name=mediunivers-service

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mediUniverse
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
spring.flyway.default-schema=public

# Custom MediUnivers Application Properties
mediunivers.issuer-uri=http://localhost:8080
mediunivers.frontend-base-url=http://localhost:3000
mediunivers.frontend-oauth-callback-path=/oauth/callback

# Payment Gateway (Razorpay)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.enabled=${RAZORPAY_ENABLED:false}

# Logging Configurations
logging.level.org.springframework.security=INFO
