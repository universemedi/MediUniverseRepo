# Server configuration
server.port=8080

# Spring Application Name
spring.application.name=mediunivers-service

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mediUniverse
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
spring.flyway.default-schema=public

# Custom MediUnivers Application Properties
mediunivers.issuer-uri=http://localhost:8080
mediunivers.frontend-base-url=http://localhost:3000
mediunivers.frontend-oauth-callback-path=/oauth/callback

# Free-trial expiry job (req #7) — standard cron syntax, configurable via env var. Default: hourly, on the hour.
mediunivers.trial-expiry-cron=${TRIAL_EXPIRY_CRON:0 0 * * * *}

# Payment Gateway (Razorpay)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.enabled=${RAZORPAY_ENABLED:false}
# Mock mode: no real Razorpay account needed locally — synthesizes orders and auto-verifies
# payments so the full subscribe/billing flow can be exercised end-to-end. Set to false (and
# configure real keys + enabled=true) for production.
razorpay.mock=${RAZORPAY_MOCK:true}

# Logging Configurations
logging.level.org.springframework.security=INFO

# Image uploads (testimonial photos, blog covers, team photos, etc.) — stored on local
# disk and served back publicly under /api/public/uploads/**. No cloud storage account
# needed for this environment; swap FileStorageService for an S3-backed one later without
# touching any callers (they only depend on getting a URL back from the upload endpoint).
mediunivers.uploads-dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
