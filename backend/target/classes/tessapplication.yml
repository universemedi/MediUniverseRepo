server:
  port: 8080

spring:
  application:
    name: mediunivers-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mediunivers}
    username: ${DB_USER:mediunivers}
    password: ${DB_PASSWORD:mediunivers}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mediunivers:
  # Public base URL of THIS backend — used as the OAuth2 issuer and in the
  # OIDC discovery document. Must exactly match how the frontend reaches it.
  issuer-uri: ${MEDIUNIVERS_ISSUER_URI:http://localhost:8080}
  # Where the SPA lives — used for CORS and as the default OAuth2 redirect URI.
  frontend-base-url: ${MEDIUNIVERS_FRONTEND_URL:http://localhost:3000}
  frontend-oauth-callback-path: /oauth/callback

# Payment gateway (Razorpay). Leave RAZORPAY_ENABLED unset/false until real keys are
# configured — BillingService's online-payment endpoints return a clear 503 instead of
# silently pretending to work when it's off. Get test keys from the Razorpay dashboard
# (Settings -> API Keys) and set these as environment variables; never commit real keys.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  enabled: ${RAZORPAY_ENABLED:false}

logging:
  level:
    org.springframework.security: INFO
